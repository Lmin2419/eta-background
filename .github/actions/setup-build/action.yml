name: 配置 Eta 构建环境
description: 安装 JDK、Gradle 与 Android SDK，供 Etax Build 的检查与签名构建共用

runs:
  using: composite
  steps:
    - name: 安装 Android Shell 兼容性测试工具
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends mksh busybox toybox

    - name: 配置 JDK 25
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v5
      with:
        distribution: temurin
        java-version: "25"

    # setup-gradle 默认执行 Gradle Wrapper 校验，无需单独的校验步骤
    - name: 配置 Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      with:
        cache-provider: basic

    - name: 配置 Android SDK 工具
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: ""
        log-accepted-android-sdk-licenses: false

    - name: 安装 Android SDK 37
      shell: bash
      run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;35.0.0"
