name: Etax Build

# 后台版唯一的 CI。三个 job 从上往下依次执行：
#   check   每次推送都跑：接线、引擎部署测试、全量单元测试、lint
#   build   check 通过后，仅 main / etax-* / 手动运行：Release 构建、签名、上传 APK
#   release build 成功后，仅 main 且用自有证书签名：发布 GitHub 预发布
# 测试只在 check 里跑一次。不需要 pull_request 触发：PR 的源分支推送时已经测过，
# PR 页面会显示该提交的检查结果。
on:
  push:
    branches-ignore:
      - "harmony/**"
    # 只改说明文档或鸿蒙移植时不重建 Android。不能写成 **/*.md：
    # app/src/main/assets/builtin_skills/*/SKILL.md 会打进 APK。
    paths-ignore:
      - "docs/**"
      - "harmony-agent/**"
      - "HARMONY.md"
      - "README.md"
      - "README_EN.md"
      - "etax/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etax-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 测试与 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 校验 etax 接线完整
        run: bash etax/check_hooks.sh

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 引擎部署回归
        run: python3 -m unittest discover -s etax/engine/tests -v

      - name: 从源码编译 root 引擎并内嵌
        run: bash etax/embed_engine.sh

      - name: 后台任务回归与静态检查
        run: |
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :app:testDebugUnitTest
          # Keep CPU-heavy lint away from time-bounded Robolectric UI recovery tests.
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :app:lintDebug
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              report = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(report.attrib[key])
          assert totals["tests"] > 0 and totals["failures"] == totals["errors"] == 0, totals
          print("Regression results:", totals)
          lint = ET.parse("app/build/reports/lint-results-debug.xml").getroot()
          severities = {}
          for issue in lint.findall("issue"):
              severity = issue.attrib["severity"]
              severities[severity] = severities.get(severity, 0) + 1
          print("Lint results:", severities)
          PY

      - name: 保存 UI 组件渲染
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-component-previews
          path: |
            app/build/reports/eta-theme/*.png
            app/build/reports/eta-stage2/*.png
            app/build/reports/eta-stage3/
          if-no-files-found: ignore
          retention-days: 30

      - name: 保存失败检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: 签名构建 APK
    needs: check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/etax-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      has_key: ${{ steps.sign.outputs.has_key }}
      apk_sha256: ${{ steps.apk.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 从源码编译 root 引擎并内嵌
        run: bash etax/embed_engine.sh

      - name: 还原签名证书
        id: sign
        env:
          ETAX_KEYSTORE_BASE64: ${{ secrets.ETAX_KEYSTORE_BASE64 }}
          ETAX_STORE_PASSWORD: ${{ secrets.ETAX_STORE_PASSWORD }}
          ETAX_KEY_ALIAS: ${{ secrets.ETAX_KEY_ALIAS }}
          ETAX_KEY_PASSWORD: ${{ secrets.ETAX_KEY_PASSWORD }}
        run: |
          if [[ -n "$ETAX_KEYSTORE_BASE64" ]]; then
            # 配了 keystore 就必须四个都齐，否则 gradle 会产出未签名 APK。缺哪个报哪个（不打印值）。
            missing=""
            [[ -z "$ETAX_STORE_PASSWORD" ]] && missing="$missing ETAX_STORE_PASSWORD"
            [[ -z "$ETAX_KEY_ALIAS" ]]      && missing="$missing ETAX_KEY_ALIAS"
            [[ -z "$ETAX_KEY_PASSWORD" ]]   && missing="$missing ETAX_KEY_PASSWORD"
            if [[ -n "$missing" ]]; then
              echo "::error::已配置 ETAX_KEYSTORE_BASE64，但这些签名 Secret 缺失或为空：$missing"
              echo "::error::请到 仓库 Settings → Secrets and variables → Actions 补齐（名字须完全一致：ETAX_KEYSTORE_BASE64 / ETAX_STORE_PASSWORD / ETAX_KEY_ALIAS / ETAX_KEY_PASSWORD）。或暂时删掉 ETAX_KEYSTORE_BASE64 改用临时证书。"
              exit 1
            fi
            printf '%s' "$ETAX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/etax.jks"
            echo "签名证书就绪：四个 Secret 齐全，将用你的 keystore 签名"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::没有配置 ETAX_KEYSTORE_BASE64：用临时证书签名，装机前需先卸载旧的 etax"
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ steps.sign.outputs.has_key == 'true' && format('{0}/etax.jks', runner.temp) || '' }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETAX_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETAX_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETAX_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          "-Peta.buildMetadata=etax.${GITHUB_SHA::7}"
          :app:assembleRelease

      - name: 签名与整理
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [[ ${#apks[@]} -eq 1 ]] || { echo "::error::Release APK 数量异常（${#apks[@]}）"; exit 1; }
          apk="${apks[0]}"
          bt="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          if [[ "${{ steps.sign.outputs.has_key }}" != "true" ]]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/tmp.jks" -storepass android -keypass android \
              -alias tmp -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=etax-temp" >/dev/null 2>&1
            "$bt/zipalign" -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            out="$RUNNER_TEMP/Etax-tempkey.apk"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/tmp.jks" --ks-pass pass:android \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            apk="$out"
          fi
          if ! "$bt/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::error::APK 没有签上：检查 ETAX_STORE_PASSWORD / ETAX_KEY_ALIAS / ETAX_KEY_PASSWORD 四个 Secrets 是否都填了"
            exit 1
          fi
          "$bt/apksigner" verify --print-certs "$apk" | head -n 3
          pkg="$("$bt/aapt2" dump packagename "$apk")"
          [[ "$pkg" == "io.github.mangi.etax" ]] || { echo "::error::包名是 $pkg，应为 io.github.mangi.etax"; exit 1; }
          # Check the signed artifact, not only the staging directory.
          python3 - "$apk" <<'PY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              for entry, source in {
                  "assets/vdrive.dex": "app/src/main/assets/vdrive.dex",
                  "assets/vdrive.version": "app/src/main/assets/vdrive.version",
                  "assets/eta-engine/vd.sh": "etax/engine/vd.sh",
                  "assets/eta-engine/install_vdrive.sh": "etax/engine/install_vdrive.sh",
                  "assets/eta-engine/check_pair.sh": "etax/engine/check_pair.sh",
              }.items():
                  assert apk.read(entry) == pathlib.Path(source).read_bytes(), entry
              assert not any(name.endswith("/engine.token") for name in apk.namelist())
              print("Signed APK engine pair verified:", apk.read("assets/vdrive.version").decode().strip())
          PY
          sha256sum "$apk"
          {
            echo "path=$apk"
            echo "name=$(basename "$apk")"
            echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
            echo "version_code=$(sed -n 's/^ *versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
            echo "version_name=$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          } >> "$GITHUB_OUTPUT"

      - name: 上传 APK
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  # 只有这个 job 能写 Release；check / build 仍是只读令牌。临时证书包从不发布。
  release:
    name: 发布 GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: 取回已签名 APK 并核对摘要
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          # 文件名和版本号在本 job 内重新取得：job 输出含 Secret 片段（如证书别名）时会被 GitHub 整个丢弃。
          APK_NAME="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .name)"
          [[ -n "$APK_NAME" ]] || { echo "::error::取不到产物文件名"; exit 1; }
          gradle="$(gh api "repos/$GITHUB_REPOSITORY/contents/app/build.gradle.kts?ref=$GITHUB_SHA" -H "Accept: application/vnd.github.raw")"
          VERSION_CODE="$(sed -n 's/^ *versionCode *= *\([0-9][0-9]*\).*/\1/p' <<<"$gradle" | head -n 1)"
          VERSION_NAME="$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' <<<"$gradle" | head -n 1)"
          [[ -n "$VERSION_CODE" && -n "$VERSION_NAME" ]] || { echo "::error::取不到版本号"; exit 1; }
          { echo "APK_NAME=$APK_NAME"; echo "VERSION_CODE=$VERSION_CODE"; echo "VERSION_NAME=$VERSION_NAME"; } >> "$GITHUB_ENV"
          f="$RUNNER_TEMP/download.bin"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$f"
          # archive:false 的产物直接返回 APK 本身；万一被套了一层 zip，就取出里面的同名文件。
          if [[ "$(sha256sum "$f" | cut -d' ' -f1)" != "$APK_SHA256" ]] && unzip -l "$f" "$APK_NAME" >/dev/null 2>&1; then
            unzip -p "$f" "$APK_NAME" > "$f.apk" && mv -f "$f.apk" "$f"
          fi
          got="$(sha256sum "$f" | cut -d' ' -f1)"
          [[ "$got" == "$APK_SHA256" ]] || { echo "::error::取回的 APK 摘要不符：$got，构建时为 $APK_SHA256"; exit 1; }
          mv -f "$f" "$RUNNER_TEMP/$APK_NAME"

      - name: 创建或更新预发布
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          tag="etax-${VERSION_CODE}-${GITHUB_SHA::7}"
          file="$RUNNER_TEMP/$APK_NAME"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 重跑同一提交：只替换附件
            gh release upload "$tag" "$file" --clobber -R "$GITHUB_REPOSITORY"
          else
            notes="Eta 后台版 ${VERSION_NAME}（versionCode ${VERSION_CODE}），源码 ${GITHUB_SHA}。

          自动发布的测试包，真机验证前标为「预发布」；验证通过后可在本页编辑取消预发布。版本说明见 [etax/README.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/etax/README.md)。

          APK SHA-256: \`${APK_SHA256}\`
          构建记录: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh release create "$tag" "$file" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Eta 后台版 ${VERSION_NAME} (${VERSION_CODE}) · ${GITHUB_SHA::7}" --notes "$notes"
          fi
          echo "已发布：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
